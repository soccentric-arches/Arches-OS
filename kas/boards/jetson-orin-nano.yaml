header:
  version: 14
  includes:
    - kas/common.yaml

machine: jetson-orin-nano-devkit

local_conf_header:
  wks: |
    # A/B OTA partition layout (see meta-arches/wic/sdimage-jetson-orin.wks)
    WKS_FILE = "sdimage-jetson-orin.wks"
    # Files for the FAT32 boot partition (deployed by kernel + l4t-launcher-extlinux)
    IMAGE_BOOT_FILES = "Image initrd extlinux/extlinux.conf"
